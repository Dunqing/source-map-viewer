# Deployments are handled by the Void GitHub App's managed builds.
name: Build
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          cache: true
          run-install: false
      - run: vp install
      - run: vp exec void prepare
      - run: vp check
      - run: vp test --run
      # Build + smoke-test the CLI so a broken `bin.js` is caught here
      # rather than at release tag time.
      - run: vp run --filter source-map-viewer build
      - run: node packages/cli/bin.js --help > /dev/null
      - run: vp build
